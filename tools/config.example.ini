; 复制本文件为 config.ini 再按本机情况修改（config.ini 已被 .gitignore 排除，不会上传）
; 所有路径请写你自己的实际路径——不要把别人的路径抄进来，也不要把含个人信息的路径提交到任何公开场合

[paths]
; 官方 BD 刷机包解压后的 bootloaderimage 目录
; 该目录下应有: sec_usb_xloader.img / sec_usb_xloader2.img(UCE) / sec_fastboot.img
; 例: C:\BD_extract\Taurus-AL00B-BD 1.0.0.33_Board Software_general_9.1.0_r1_EMUI10.0.0_05022RBW\Software\bootloaderimage
bd_dir =

; dump 输出目录（xloader / fastboot 明文保存到这里）
out_dir =

; 串口。留空 = 自动枚举 华为 USB Download Mode (VID 0x12D1 / PID 0x3609)
; 只有自动枚举失败时才需要手动指定，例如 COMxx
port =

; Kirin-Tool 移植模块目录：里面应有 kirin_loader.py（提供 dtl() 与 LOADER_DIR）
; 以及 LOADER_DIR 下的 null.ktl。该模块含第三方密钥材料，须自行获取，不随本仓库分发
kirin_module_dir =
